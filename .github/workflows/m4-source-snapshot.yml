name: M4 isolated source snapshot
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/m4-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3357d351df3a89b3cdfc1a1410e96f66c6fdce0c
          persist-credentials: false
      - name: Preserve tracked source and hashes only
        run: |
          mkdir -p /tmp/m4-source
          git archive --format=tar HEAD > /tmp/m4-source/source.tar
          git ls-tree -rz HEAD > /tmp/m4-source/tree-manifest.bin
          git rev-parse HEAD HEAD^{tree} > /tmp/m4-source/source-identity.txt
          sha256sum /tmp/m4-source/source.tar > /tmp/m4-source/archive-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m4-merged-source-3357d35
          path: /tmp/m4-source
          retention-days: 2
          if-no-files-found: error
