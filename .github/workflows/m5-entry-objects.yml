name: M5 checked entry repair objects
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/m5-entry-objects.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: aa492b75f57abf2f6b230ddcab0479ddec17bc13
          persist-credentials: false
      - name: Validate the reviewed patch and create immutable file objects only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 6723
          assert hashlib.sha256(patch).hexdigest() == '2a47cfc1648e9ef769aef70293013e91ab4f701b4f00bc5200a38028033b8f2f'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          assert subprocess.check_output(['git', 'write-tree']).decode().strip() == 'aac41e6cc4151b9715f9565b8df9f3a02ff828aa'
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines()
          assert paths == ['ios/LightPlan/MapView.swift', 'ios/LightPlanVisualUITests/ProductUITests.swift']
          entries = []
          for path in paths:
              content = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/iwbinb/LightPlan/git/blobs', data=json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  actual = json.load(response)['sha']
              assert actual == expected
              entries.append({'path': path, 'sha': actual})
          print(json.dumps({'files': entries, 'branch_updated': False}, indent=2))
          # No app/source execution, ref/commit/PR/tag/release mutation or credential output.
