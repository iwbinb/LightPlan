name: M5 final evidence
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/m5-final-evidence.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9e72040f61526391c36fd31d3d4e0311c4ec71c4
          persist-credentials: false
      - name: Archive tracked candidate source only
        run: |
          mkdir -p /tmp/m5-review-source
          git rev-parse HEAD > /tmp/m5-review-source/source-commit.txt
          git rev-parse HEAD^{tree} > /tmp/m5-review-source/source-tree.txt
          git ls-tree -r HEAD > /tmp/m5-review-source/source-files.txt
          git archive HEAD > /tmp/m5-review-source/source.tar
          sha256sum /tmp/m5-review-source/source.tar > /tmp/m5-review-source/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m5-review-source-9e72040
          path: /tmp/m5-review-source
          retention-days: 7
          if-no-files-found: error
  comparison:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9e72040f61526391c36fd31d3d4e0311c4ec71c4
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 133d833d3b2a3469b8345662a3f20c2ec6079403
          path: baseline
          persist-credentials: false
      - name: Compare fixed cores with identical Release fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          E="$GITHUB_WORKSPACE/evidence"
          { sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; xcodebuild -version; xcrun swift --version; } > "$E/toolchain.txt"
          git -C baseline rev-parse HEAD > "$E/baseline-commit.txt"
          git -C candidate rev-parse HEAD > "$E/candidate-commit.txt"
          cp candidate/scripts/benchmark_core.sh candidate/scripts/benchmark_core.swift baseline/scripts/
          shasum -a 256 candidate/scripts/benchmark_core.* > "$E/harness.sha256"
          bash baseline/scripts/benchmark_core.sh "$E/baseline.json" 5 2>&1 | tee "$E/baseline.log"
          bash candidate/scripts/benchmark_core.sh "$E/candidate.json" 5 2>&1 | tee "$E/candidate.log"
          python3 - "$E" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          before = json.loads((root / 'baseline.json').read_text())['measurements']
          after = json.loads((root / 'candidate.json').read_text())['measurements']
          assert len(before) == len(after) == 4
          rows = []
          for a, b in zip(before, after):
              assert a['name'] == b['name'] and a['fingerprint'] == b['fingerprint'], 'Changed result fingerprint'
              rows.append({'name': a['name'], 'baseline_median_ms': a['medianMilliseconds'], 'candidate_median_ms': b['medianMilliseconds'], 'fingerprints_equal': True})
          (root / 'comparison.json').write_text(json.dumps({'scope': 'Five measured samples after warmup per fixture; baseline then candidate on one runner. Not a device performance guarantee.', 'measurements': rows}, indent=2) + '\n')
          print((root / 'comparison.json').read_text())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: m5-release-comparison-9e72040
          path: evidence
          retention-days: 14
          if-no-files-found: error
