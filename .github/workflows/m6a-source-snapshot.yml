name: M6-A baseline source snapshot
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/m6a-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e4c84fa4b181e1cc62f89935d288809b40867898
          persist-credentials: false
      - name: Archive tracked source without local or signing material
        run: |
          set -eu
          mkdir -p /tmp/m6a-source
          git rev-parse HEAD > /tmp/m6a-source/source-commit.txt
          git rev-parse HEAD^{tree} > /tmp/m6a-source/source-tree.txt
          git ls-tree -r HEAD > /tmp/m6a-source/source-files.txt
          git archive HEAD > /tmp/m6a-source/source.tar
          sha256sum /tmp/m6a-source/source.tar > /tmp/m6a-source/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m6a-baseline-e4c84fa
          path: /tmp/m6a-source
          retention-days: 7
          if-no-files-found: error
