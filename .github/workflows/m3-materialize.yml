name: M3 checked source objects
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/m3-materialize.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0ace4241231785c47af00a5f2d89fc0a7281e192
          persist-credentials: false
      - name: Verify exact reviewed patch and create content-addressed objects only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          api = 'https://api.github.com/repos/iwbinb/LightPlan/git/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'LightPlan-checked-source'}
          def request(endpoint, data=None):
              encoded = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(api + endpoint, data=encoded, headers={**headers, 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          assert git('rev-parse', 'HEAD') == '0ace4241231785c47af00a5f2d89fc0a7281e192'
          pieces = ['1ca61d6c71d2555ecdf052ca1e0c786aa83da564', '8e693ed3afb9a7a6c961917eb8a7f72fae57af0d', '964d53bdffa89e72241827ede7496f093211151f', '34e965e7f4d0793e2782b373ac8f6777c7858e27', '81063daf6bc43bf0916868256922f0b37b1cd237']
          encoded = b''
          for sha in pieces:
              value = request('blobs/' + sha)
              chunk = base64.b64decode(value['content'])
              assert hashlib.sha1(b'blob ' + str(len(chunk)).encode() + b'\0' + chunk).hexdigest() == sha
              encoded += chunk
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 106967
          assert hashlib.sha256(patch).hexdigest() == '5723092e106e95370d098a8acf9ef31c1e16250913ab047f48decf224d53645d'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          expected = '9dce1dfc1f92b00ca1860dca06082a9128e9498d'
          assert git('write-tree') == expected, 'Reviewed source tree does not match'
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          assert len(paths) == 16
          entries = []
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              local_sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              uploaded = request('blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert uploaded['sha'] == local_sha
              mode = git('ls-files', '-s', '--', path).split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': local_sha})
          tree = request('trees', {'base_tree': '6499c2d2c3e6a562c3188bd49ff4e31efc363e21', 'tree': entries})
          assert tree['sha'] == expected
          print(json.dumps({'reviewed_tree': tree['sha'], 'files': entries, 'branch_updated': False}, ensure_ascii=False, indent=2))
          # No commit, ref, pull-request, tag or release API is called here.
