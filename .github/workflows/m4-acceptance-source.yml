name: M4 acceptance source snapshot
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/m4-acceptance-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 899893acf9da7fb3038b0fade059d29498584808
          persist-credentials: false
      - name: Export tracked source and immutable identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot
          git archive --format=tar HEAD > snapshot/source.tar
          git rev-parse HEAD > snapshot/commit.txt
          git rev-parse 'HEAD^{tree}' > snapshot/tree.txt
          git ls-tree -r HEAD > snapshot/files.txt
          sha256sum snapshot/source.tar > snapshot/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m4-acceptance-source-899893a
          path: snapshot
          if-no-files-found: error
          retention-days: 7
