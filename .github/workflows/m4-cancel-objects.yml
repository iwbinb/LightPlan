name: M4 cancellation freshness objects
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/m4-cancel-objects.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 49938b0352babca2e8c372eca1820ba7fbae9843
          persist-credentials: false
      - name: Validate exact patch and create content-addressed blobs only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 7689
          assert hashlib.sha256(patch).hexdigest() == '5d9526dc6deebcf40c4a18464f3995c9dec3a91b0071de58db5eb5d781eb532d'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert tree == 'c989b8537f59e295cba55b5d634ace91350687e3'
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          assert len(paths) == 5
          entries = []
          for path in paths:
              content = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/iwbinb/LightPlan/git/blobs', data=json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  actual = json.load(response)['sha']
              assert actual == expected
              entries.append({'path': path, 'sha': actual})
          print(json.dumps({'validated_tree': tree, 'files': entries, 'branch_updated': False}, indent=2))
          # No transported code execution or commit/ref/PR/tag/release mutation.
