name: M3 checked native repair objects
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/m3-native-repair.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4df5c5f0721449fe6936d26c232147920c8db9bc
          persist-credentials: false
      - name: Validate exact localization patch and create source blobs only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 5487
          assert hashlib.sha256(patch).hexdigest() == 'ade88f24bcb43e3800022a7eef648fe5ef8b5e32321fd3874edb9319acaee6a5'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert tree == '19f3945e92a560a665822e49b148965dcec73854'
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          assert len(paths) == 3
          entries = []
          for path in paths:
              content = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/iwbinb/LightPlan/git/blobs', data=json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  actual = json.load(response)['sha']
              assert actual == expected
              entries.append({'path': path, 'sha': actual})
          print(json.dumps({'validated_tree': tree, 'files': entries, 'branch_updated': False}, indent=2))
          # No tree, commit, ref, PR, tag or release API is called here.
