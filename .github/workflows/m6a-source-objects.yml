name: M6-A checked source objects
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/m6a-source-objects.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e4c84fa4b181e1cc62f89935d288809b40867898
          persist-credentials: false
      - name: Validate reviewed patch and create immutable blobs only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root = 'https://api.github.com/repos/iwbinb/LightPlan'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          parts = []
          for sha in ['3b4fb84e06543130e78b32eca5da50ef536b885c', 'ec9def899df3791a34e0da3d9772fb0835e85cf1', 'e8b2612eaadbccfe82a033f75fbd3fb2131a2cf8', 'b5a092b756feb245a0e4f8b7440fa232e58304b4']:
              request = urllib.request.Request(root + '/git/blobs/' + sha, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  obj = json.load(response)
              part = base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha
              parts.append(part)
          patch = lzma.decompress(b''.join(parts), memlimit=256 * 1024 * 1024)
          assert len(patch) == 75519
          assert hashlib.sha256(patch).hexdigest() == 'b1fa99bddf76352459122cfe062b6c1c6c4eb4eb4d839c015a500f2c8f4ee469'
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert tree == 'e06fec9d1d7f24c1959e682da3f0f48774e41f5a'
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          assert len(paths) == 21
          entries = []
          for path in paths:
              content = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              request = urllib.request.Request(root + '/git/blobs', data=json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode(), headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  actual = json.load(response)['sha']
              assert actual == expected
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', path]).decode().split()[0]
              entries.append({'path': path, 'sha': actual, 'mode': mode, 'type': 'blob'})
          print(json.dumps({'validated_tree': tree, 'files': entries, 'branch_updated': False}, indent=2))
          # No transported code execution, branch/PR/release mutation, signing or credential output.
