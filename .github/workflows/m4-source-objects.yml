name: M4 checked source objects
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/m4-source-objects.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3357d351df3a89b3cdfc1a1410e96f66c6fdce0c
          persist-credentials: false
      - name: Validate reviewed patch and create content-addressed blobs only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          api = 'https://api.github.com/repos/iwbinb/LightPlan/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          chunks = ['dc4d12c737befc8bc0e8818ad10f1fbd3eb862aa', '9841b4b04b72b06986d9e4c97e2517b10bafe88a', '99b1d67f245631d4812b73e6d97f18b9d0b38f03', '22014b8f8d0b1195d68da4c2f7aef4212be439fc']
          encoded = ''
          for sha in chunks:
              with urllib.request.urlopen(urllib.request.Request(api + '/' + sha, headers=headers), timeout=60) as response:
                  blob = json.load(response)
              content = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest() == sha
              encoded += content.decode('ascii')
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 147163
          assert hashlib.sha256(patch).hexdigest() == '8ba9fb58f6225e36dca5b365e47b66191c0035ff5ae223a0148a279cec8b3e01'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert tree == '54118e7f68e2beb311004d459a80034c33dde4d3'
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          assert len(paths) == 25
          entries = []
          for path in paths:
              content = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              request = urllib.request.Request(api, data=json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode(), headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  actual = json.load(response)['sha']
              assert actual == expected
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': actual})
          print(json.dumps({'validated_tree': tree, 'files': entries, 'branch_updated': False}, ensure_ascii=False, indent=2))
          # No transported code is executed. No commit/ref/PR/tag/release API is called.
